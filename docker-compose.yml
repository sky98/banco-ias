services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bancoias}
      POSTGRES_USER: ${POSTGRES_USER:-bancoias}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bancoias}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bancoias} -d ${POSTGRES_DB:-bancoias}"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  back:
    build:
      context: ./back
      dockerfile: deployment/Dockerfile
    ports:
      - "${BACK_PORT:-8080}:8080"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://db:5432/${POSTGRES_DB:-bancoias}
      SPRING_R2DBC_USERNAME: ${POSTGRES_USER:-bancoias}
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:-bancoias}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8080,http://localhost:8081}
      SQL_INIT_MODE: ${SQL_INIT_MODE:-always}
      SQL_INIT_SCHEMA_LOCATIONS: ${SQL_INIT_SCHEMA_LOCATIONS:-classpath:schema.sql}
      SQL_INIT_DATA_LOCATIONS: ${SQL_INIT_DATA_LOCATIONS:-classpath:data.sql}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "${FRONT_PORT:-8081}:80"
    depends_on:
      back:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
